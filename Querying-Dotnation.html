<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        // Dot ( Accesing) Properties

        let user = { name: "Nova", age: 25};
        console.log(user.name); //Nova

        // Bracket Notation (usful for dynamic keys)
        
        console.log(user["age"]);  //25
        let key = "name";
        console.log(user[key]);  //Nova
    </script>
</body>
</html>
