<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if...else Statement</title>
</head>
<body>
    <script>
        let age = 16;
        if (age >= 18)
    {
        console.log("You Can Vote");
    }
    else
    {
        console.log("You Cannot Vote");
    }
    </script>
</body>
</html>
