<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if...else if</title>
</head>
<body>
    <script>
     let marks = 75;

        if (marks >= 90) 
        {
        console.log("Grade A");
        }
         else if (marks >= 70) 
        {
        console.log("Grade B");
        }
        else if (marks >= 50) 
        {
        console.log("Grade C");
        } 
        else 
        {
        console.log("Fail");
        }
            </script>
</body>
</html>
